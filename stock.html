<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alaric · Gestion du stock MJ</title>
  <meta name="description" content="Interface MJ connectée à Supabase pour gérer le stock de l’échoppe d’Alaric." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="stock-admin">
  <main class="admin-shell">
    <header class="admin-header">
      <p class="eyebrow">Outil MJ · Supabase</p>
      <h1>Gestion du stock</h1>
      <p>Les quantités sont enregistrées directement en ligne. Une ligne absente dans Supabase signifie « stock illimité ».</p>

      <div class="admin-auth" id="auth-panel">
        <form class="admin-auth__form" id="login-form">
          <label class="field" for="login-email">
            <span>Email MJ</span>
            <input id="login-email" type="email" autocomplete="username" required />
          </label>
          <label class="field" for="login-password">
            <span>Mot de passe</span>
            <input id="login-password" type="password" autocomplete="current-password" required />
          </label>
          <button class="button button--primary" type="submit" id="login-button">Connexion MJ</button>
        </form>

        <div class="admin-auth__session" id="session-panel" hidden>
          <span id="session-user"></span>
          <button class="button button--ghost button--small" type="button" id="logout-button">Déconnexion</button>
        </div>
      </div>

      <div class="admin-actions">
        <button class="button button--ghost" id="reload-stock" type="button">Actualiser les stocks</button>
        <a class="button button--ghost" href="index.html">Retour à la boutique</a>
      </div>

      <div class="admin-actions">
        <label class="field" for="stock-search">
          <span>Rechercher un objet</span>
          <input id="stock-search" type="search" placeholder="Nom, catégorie…" autocomplete="off" />
        </label>
      </div>

      <p class="admin-message" id="admin-message" role="status">Connexion à Supabase…</p>
    </header>

    <section class="admin-panel" aria-labelledby="stock-title">
      <div class="admin-status">
        <div>
          <strong id="stock-title">Stock de la sélection d’Alaric</strong>
          <span id="stock-summary"></span>
        </div>
        <div class="admin-actions">
          <button class="button button--small button--ghost" id="all-one" type="button" disabled>Tout mettre à 1</button>
          <button class="button button--small button--ghost" id="all-unlimited" type="button" disabled>Tout mettre en illimité</button>
        </div>
      </div>

      <div class="stock-table-wrap">
        <table class="stock-table">
          <thead>
            <tr>
              <th>Objet</th>
              <th>Prix</th>
              <th>Stock</th>
            </tr>
          </thead>
          <tbody id="stock-rows">
            <tr><td colspan="3">Chargement…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="stock.js"></script>
</body>
</html>
